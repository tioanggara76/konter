<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piutang Konter</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
    padding-bottom:100px;
}

.header{
    background:linear-gradient(135deg,#0d6efd,#0a58ca);
    color:white;
    padding:25px;
    border-radius:0 0 25px 25px;
}

.stat-card{
    border:none;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.form-card{
    border:none;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.list-card{
    border:none;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    margin-bottom:15px;
}

.rp{
    font-size:22px;
    font-weight:bold;
}

.section-title{
    font-weight:700;
    margin-bottom:15px;
}

.empty{
    text-align:center;
    color:gray;
    padding:20px;
}

.btn{
    border-radius:12px;
}

input{
    border-radius:12px !important;
}

</style>
</head>
<body>

<div class="header text-center">
    <h3>📱 Piutang Konter</h3>
    <small>Catatan Pelanggan Belum Bayar</small>
</div>

<div class="container mt-4">

    <div class="row g-3 mb-4">

        <div class="col-6">
            <div class="card stat-card bg-danger text-white">
                <div class="card-body text-center">
                    <small>Total Piutang</small>
                    <h5 id="totalPiutang">Rp 0</h5>
                </div>
            </div>
        </div>

        <div class="col-6">
            <div class="card stat-card bg-success text-white">
                <div class="card-body text-center">
                    <small>Total Pemasukan</small>
                    <h5 id="totalPemasukan">Rp 0</h5>
                </div>
            </div>
        </div>

    </div>

    <div class="card form-card mb-4">
        <div class="card-body">

            <h5 class="mb-3">Tambah Piutang</h5>

            <input
                type="text"
                id="nama"
                class="form-control mb-3"
                placeholder="Nama Pelanggan">

            <input
                type="number"
                id="nominal"
                class="form-control mb-3"
                placeholder="Nominal">

            <input
                type="text"
                id="keterangan"
                class="form-control mb-3"
                placeholder="Keterangan Transaksi">

            <button
                class="btn btn-primary w-100"
                onclick="tambahData()">
                + Tambah Piutang
            </button>

        </div>
    </div>

    <h5 class="section-title">
        🔴 Belum Bayar
    </h5>

    <div id="belumBayar"></div>

    <h5 class="section-title mt-4">
        🟢 Riwayat Pembayaran
    </h5>

    <div id="riwayat"></div>

</div>

<script>

let piutang =
JSON.parse(localStorage.getItem('piutang')) || [];

let pemasukan =
JSON.parse(localStorage.getItem('pemasukan')) || [];

function simpanData(){

    localStorage.setItem(
        'piutang',
        JSON.stringify(piutang)
    );

    localStorage.setItem(
        'pemasukan',
        JSON.stringify(pemasukan)
    );
}

function formatRupiah(angka){

    return "Rp " +
    angka.toLocaleString("id-ID");
}

function tambahData(){

    let nama =
    document.getElementById('nama').value.trim();

    let nominal =
    document.getElementById('nominal').value;

    let keterangan =
    document.getElementById('keterangan').value.trim();

    if(nama === "" || nominal === ""){

        alert("Lengkapi data terlebih dahulu");
        return;
    }

    let tanggal =
    new Date().toLocaleDateString('id-ID');

    piutang.push({

        nama:nama,
        nominal:Number(nominal),
        keterangan:keterangan,
        tanggal:tanggal,
        status:"Belum Bayar"

    });

    simpanData();

    document.getElementById('nama').value="";
    document.getElementById('nominal').value="";
    document.getElementById('keterangan').value="";

    tampilData();
}

function lunas(index){

    let data = piutang[index];

    data.status = "Lunas";

    pemasukan.push(data);

    piutang.splice(index,1);

    simpanData();

    tampilData();
}

function hapusPiutang(index){

    if(confirm("Hapus data ini ?")){

        piutang.splice(index,1);

        simpanData();

        tampilData();
    }
}

function tampilData(){

    let totalPiutang = 0;
    let totalPemasukan = 0;

    let htmlPiutang = "";

    if(piutang.length === 0){

        htmlPiutang = `
        <div class="empty">
            Tidak ada piutang
        </div>`;
    }

    piutang.forEach((item,index)=>{

        totalPiutang += item.nominal;

        htmlPiutang += `

        <div class="card list-card">

            <div class="card-body">

                <div class="d-flex justify-content-between">

                    <div>

                        <h6 class="mb-1">
                            ${item.nama}
                        </h6>

                        <small class="text-muted d-block">
                            ${item.tanggal}
                        </small>

                        <small class="text-primary fw-semibold">
                            ${item.keterangan}
                        </small>

                    </div>

                    <span class="badge bg-danger">
                        Belum Bayar
                    </span>

                </div>

                <div class="rp text-danger mt-3">
                    ${formatRupiah(item.nominal)}
                </div>

                <div class="row mt-3">

                    <div class="col-6">

                        <button
                        class="btn btn-success w-100"
                        onclick="lunas(${index})">
                        Lunas
                        </button>

                    </div>

                    <div class="col-6">

                        <button
                        class="btn btn-outline-danger w-100"
                        onclick="hapusPiutang(${index})">
                        Hapus
                        </button>

                    </div>

                </div>

            </div>

        </div>

        `;
    });

    document.getElementById('belumBayar').innerHTML = htmlPiutang;

    let htmlPemasukan = "";

    if(pemasukan.length === 0){

        htmlPemasukan = `
        <div class="empty">
            Belum ada pembayaran
        </div>`;
    }

    pemasukan.forEach(item=>{

        totalPemasukan += item.nominal;

        htmlPemasukan += `

        <div class="card list-card">

            <div class="card-body">

                <div class="d-flex justify-content-between">

                    <div>

                        <h6 class="mb-1">
                            ${item.nama}
                        </h6>

                        <small class="text-muted d-block">
                            ${item.tanggal}
                        </small>

                        <small class="text-success fw-semibold">
                            ${item.keterangan}
                        </small>

                    </div>

                    <span class="badge bg-success">
                        Lunas
                    </span>

                </div>

                <div class="rp text-success mt-3">
                    ${formatRupiah(item.nominal)}
                </div>

            </div>

        </div>

        `;
    });

    document.getElementById('riwayat').innerHTML = htmlPemasukan;

    document.getElementById('totalPiutang').innerHTML =
    formatRupiah(totalPiutang);

    document.getElementById('totalPemasukan').innerHTML =
    formatRupiah(totalPemasukan);
}

tampilData();

</script>

</body>
</html>
